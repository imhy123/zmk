description: |
  Sensor driver for the Alps EC11 rotary encoder

compatible: "alps,ec11"

properties:
  label:
    type: string
    required: false
    deprecated: true
  a-gpios:
    type: phandle-array
    required: true
    description: A pin for the encoder
  b-gpios:
    type: phandle-array
    required: true
    description: A pin for the encoder
  resolution:
    type: int
    description: Number of pulses per tick
    deprecated: true
    required: false
  steps:
    type: int
    description: Number of pulses in one full rotation
    required: false
  pulses-per-detent:
    type: int
    description: |
      Number of valid quadrature transitions that make up one physical detent.
      Counted once per detent; contact bounce (alternating +1/-1 transitions)
      cancels out before reaching this threshold. Defaults to 2.
    required: false
  reverse-guard-us:
    type: int
    description: |
      Directional glitch filter. If >0, a detent in the opposite direction to
      the last emitted one is treated as a glitch when it completes within this
      many microseconds of the last same-direction transition (a real reversal
      has a larger velocity-through-zero gap). No edges are dropped. 0 disables.
      Defaults to 800.
    required: false
  reverse-glitch-as-codir:
    type: int
    description: |
      How a glitch caught by reverse-guard-us is handled. Nonzero: emit a detent
      in the committed direction (the glitch is misdecoded same-direction motion),
      so the count does not lag. 0: drop the glitch entirely. Defaults to 1.
    required: false
  codir-guard-us:
    type: int
    description: |
      Minimum time since the last emitted detent before a same-direction (codir)
      recovery may fire. A glitch sooner than this is the just-emitted detent's
      settling chatter and is dropped, so one physical detent cannot emit twice;
      a glitch later than this is a genuinely missed detent and is recovered.
      0 disables the gate. Defaults to 3000.
    required: false